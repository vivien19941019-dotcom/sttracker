name: 更新川普交易資料

on:
  schedule:
    - cron: "0 1 * * *"    # 每天 UTC 01:00（台灣時間早上 9 點）
  workflow_dispatch:        # 也可以在 GitHub 頁面手動執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲
        run: python scraper.py

      - name: 有新資料就 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "更新交易資料 $(date -u +%Y-%m-%d)"
          git push
